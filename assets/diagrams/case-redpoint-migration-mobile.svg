<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 690" role="img" aria-labelledby="title desc">
  <title id="title">Mobile workflow migration comparison</title>
  <desc id="desc">Legacy Redpoint and Azure Logic Apps each carry the same business logic through aligned workflow stages. The results are reconciled and validated.</desc>
  <defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0v22" fill="none" stroke="#718c3d" stroke-opacity=".1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8Z" fill="#d2f36b"/></marker></defs>
  <rect width="390" height="690" rx="18" fill="#f4f3ec"/><rect width="390" height="690" rx="18" fill="url(#grid)"/>
  <text x="22" y="34" fill="#6f8f39" font-family="monospace" font-size="10" letter-spacing="1.2">PRESERVE · MIGRATE · VERIFY</text>
  <text x="24" y="94" fill="#718078" font-family="monospace" font-size="10">01 / LEGACY · REDPOINT</text>
  <path d="M50 155H340" stroke="#aab5a9" stroke-width="2"/>
  <g fill="#fcfcf7" stroke="#aab5a9" stroke-width="2"><circle cx="52" cy="155" r="18"/><circle cx="148" cy="155" r="18"/><circle cx="244" cy="155" r="18"/><circle cx="340" cy="155" r="18"/></g>
  <g fill="none" stroke="#52645a" stroke-width="1.7" stroke-linecap="round"><path d="M47 155h10m-5-5v10"/><path d="M143 149h10v12h-10z"/><ellipse cx="244" cy="151" rx="6" ry="3"/><path d="M238 151v8c0 4 12 4 12 0v-8"/><path d="M337 148h6v13h-8v-13z"/></g>
  <g fill="#46584f" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><text x="52" y="189">Trigger</text><text x="148" y="189">Business</text><text x="148" y="202">logic</text><text x="244" y="189">SQL · if</text><text x="244" y="202">applicable</text><text x="340" y="189">Output</text></g>
  <rect x="89" y="226" width="212" height="28" rx="14" fill="#d2f36b"/><text x="195" y="244" text-anchor="middle" fill="#263b30" font-family="monospace" font-size="9" letter-spacing=".4">CARRY FORWARD EXISTING RULES</text>
  <text x="24" y="296" fill="#58722f" font-family="monospace" font-size="10">02 / MIGRATED · AZURE LOGIC APPS</text>
  <path d="M50 357H340" stroke="#718c3d" stroke-width="3"/>
  <g fill="#fcfcf7" stroke="#8ea45e" stroke-width="2"><circle cx="52" cy="357" r="18"/><circle cx="148" cy="357" r="18"/><circle cx="244" cy="357" r="18"/><circle cx="340" cy="357" r="18"/></g>
  <g fill="none" stroke="#58722f" stroke-width="1.7" stroke-linecap="round"><path d="M47 357h10m-5-5v10"/><path d="M143 351h10v12h-10z"/><ellipse cx="244" cy="353" rx="6" ry="3"/><path d="M238 353v8c0 4 12 4 12 0v-8"/><path d="M337 350h6v13h-8v-13z"/></g>
  <g fill="#263b30" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><text x="52" y="391">Trigger</text><text x="148" y="391">Same</text><text x="148" y="404">business logic</text><text x="244" y="391">SQL · if</text><text x="244" y="404">applicable</text><text x="340" y="391">Output</text></g>
  <path d="M340 179C340 439 270 444 250 477M340 381C340 439 270 444 250 477" fill="none" stroke="#718c3d" stroke-width="1.5" stroke-dasharray="4 6" marker-end="url(#arrow)"/>
  <rect x="22" y="480" width="346" height="174" rx="16" fill="#10221e"/>
  <text x="42" y="511" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing="1">03 / OUTPUT RECONCILIATION</text>
  <g fill="#bdcbbf"><rect x="42" y="532" width="16" height="6" rx="3"/><rect x="65" y="532" width="108" height="6" rx="3"/><rect x="182" y="532" width="36" height="6" rx="3"/><rect x="42" y="548" width="16" height="6" rx="3"/><rect x="65" y="548" width="108" height="6" rx="3"/><rect x="182" y="548" width="36" height="6" rx="3"/></g>
  <circle cx="321" cy="545" r="16" fill="#d2f36b"/><path d="m314 545 5 5 9-11" fill="none" stroke="#10221e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="591" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="16" font-weight="700">Test and validate results</text>
  <text x="42" y="617" fill="#bdcbbf" font-family="Arial,sans-serif" font-size="12">Resolve differences against expected behavior.</text>
  <circle r="6" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="7s" repeatCount="indefinite" path="M50 357H340V445C340 465 270 465 250 477"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
</svg>
