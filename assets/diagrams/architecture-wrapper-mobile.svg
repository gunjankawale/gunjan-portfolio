<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 940" role="img" aria-labelledby="title desc">
<title id="title">Shared Logic Apps Try and Catch wrapper</title><desc id="desc">Mobile diagram of a workflow trigger, Try actions and dashboard status logging, then Catch failure handling with email alert and dashboard failure log. API response statuses are not part of this shared wrapper.</desc>
<rect width="420" height="940" rx="24" fill="#10221e"/><text x="28" y="48" fill="#d2f36b" font-family="monospace" font-size="12" letter-spacing="1.3">SHARED LOGIC APPS WRAPPER</text>
<rect x="24" y="78" width="372" height="146" rx="18" fill="#fcfcf7"/><text x="48" y="116" fill="#6a873b" font-family="monospace" font-size="11">TRIGGER</text><text x="48" y="151" fill="#10221e" font-family="Arial" font-size="22" font-weight="700">Start run</text><text x="48" y="180" fill="#5d6d64" font-family="Arial" font-size="14">Schedule or file event</text>
<path d="M210 224V263" stroke="#d2f36b" stroke-width="3"/><path d="m202 254 8 11 8-11" fill="#d2f36b"/>
<rect x="24" y="270" width="372" height="338" rx="20" fill="#f2f1e9" stroke="#d2f36b" stroke-width="3"/><text x="48" y="307" fill="#6a873b" font-family="monospace" font-size="12">TRY SCOPE · ACTIONS VARY BY WORKFLOW</text>
<rect x="46" y="329" width="328" height="76" rx="12" fill="#e0e7db"/><text x="66" y="361" fill="#10221e" font-family="Arial" font-size="17" font-weight="700">SQL · API · other actions</text><text x="66" y="385" fill="#5d6d64" font-family="Arial" font-size="12">Only when the workflow requires them</text>
<rect x="46" y="420" width="328" height="153" rx="12" fill="#e8eee1"/><text x="66" y="452" fill="#6a873b" font-family="monospace" font-size="10">STEP STATUS LOGGING</text><text x="66" y="484" fill="#10221e" font-family="Arial" font-size="16" font-weight="700">Dashboard workflow status</text><text x="66" y="515" fill="#52645a" font-family="Arial" font-size="13">In Progress · Completed</text><text x="66" y="540" fill="#52645a" font-family="Arial" font-size="13">Failed · Skipped</text><text x="66" y="561" fill="#66756c" font-family="Arial" font-size="11">Values; not Azure action names</text>
<path d="M210 608V650" stroke="#d2f36b" stroke-width="3"/><path d="m202 641 8 11 8-11" fill="#d2f36b"/><text x="230" y="636" fill="#d2f36b" font-family="monospace" font-size="9">ACTION FAILS</text>
<rect x="24" y="659" width="372" height="232" rx="20" fill="#29483d" stroke="#d2f36b" stroke-width="2"/><text x="48" y="699" fill="#d2f36b" font-family="monospace" font-size="12">CATCH SCOPE</text><rect x="46" y="719" width="328" height="66" rx="12" fill="#fcfcf7"/><text x="66" y="759" fill="#10221e" font-family="Arial" font-size="17" font-weight="700">Email alert</text><rect x="46" y="800" width="328" height="66" rx="12" fill="#fcfcf7"/><text x="66" y="840" fill="#10221e" font-family="Arial" font-size="17" font-weight="700">Monitoring dashboard failure log</text>
<text x="210" y="921" text-anchor="middle" fill="#c2cfc5" font-family="monospace" font-size="9">API PASS / FAIL IS WORKFLOW-SPECIFIC LOGIC</text><circle r="6" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="7s" repeatCount="indefinite" path="M210 224V263V270V608V650V659"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle></svg>
