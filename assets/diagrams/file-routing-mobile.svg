<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1120" role="img" aria-labelledby="title desc"><title id="title">Database-driven TXT and PDF routing</title><desc id="desc">Logic Apps starts on file arrival, reads routing and email configuration from a database, identifies TXT and PDF, moves files to database-configured output and archive locations, and emails dynamic counts to database-sourced recipients.</desc>
<rect width="420" height="1120" rx="24" fill="#10221e"/><text x="24" y="46" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing=".7">DATABASE-DRIVEN FILE ROUTING</text><rect x="20" y="68" width="380" height="790" rx="20" fill="#18382f" stroke="#d2f36b" stroke-width="2"/><text x="43" y="104" fill="#d2f36b" font-family="monospace" font-size="10">LOGIC APPS ORCHESTRATION</text>
<g fill="#fcfcf7"><rect x="43" y="125" width="334" height="76" rx="12"/><rect x="43" y="229" width="334" height="76" rx="12"/><rect x="43" y="333" width="334" height="76" rx="12"/><rect x="43" y="437" width="334" height="76" rx="12"/><rect x="43" y="541" width="334" height="76" rx="12"/><rect x="43" y="645" width="334" height="76" rx="12"/><rect x="43" y="749" width="334" height="86" rx="12"/></g>
<g fill="#10221e" font-family="Arial"><text x="65" y="155" fill="#6a873b" font-family="monospace" font-size="9">CONFIGURED INPUT FOLDER</text><text x="65" y="184" font-size="16" font-weight="700">File arrives</text><text x="65" y="259" fill="#6a873b" font-family="monospace" font-size="9">TRIGGER</text><text x="65" y="288" font-size="16" font-weight="700">Logic Apps starts</text><text x="65" y="363" fill="#6a873b" font-family="monospace" font-size="9">DATABASE LOOKUP</text><text x="65" y="392" font-size="16" font-weight="700">Read routing and email config</text><text x="65" y="467" fill="#6a873b" font-family="monospace" font-size="9">FILE HANDLING</text><text x="65" y="496" font-size="16" font-weight="700">Identify TXT and PDF files</text><text x="65" y="571" fill="#6a873b" font-family="monospace" font-size="9">ROUTE</text><text x="65" y="600" font-size="16" font-weight="700">Move to configured output location</text><text x="65" y="675" fill="#6a873b" font-family="monospace" font-size="9">ARCHIVE</text><text x="65" y="704" font-size="16" font-weight="700">Move to configured archive location</text><text x="65" y="779" fill="#6a873b" font-family="monospace" font-size="9">SUCCESS EMAIL</text><text x="65" y="811" font-size="15" font-weight="700">Dynamic TXT / PDF counts</text><text x="65" y="831" fill="#52645a" font-size="10">Database-sourced recipients</text></g>
<g stroke="#d2f36b" stroke-width="2.5"><path d="M210 201v22M210 305v22M210 409v22M210 513v22M210 617v22M210 721v22"/></g><g fill="#d2f36b"><path d="m204 215 6 8 6-8z"/><path d="m204 319 6 8 6-8z"/><path d="m204 423 6 8 6-8z"/><path d="m204 527 6 8 6-8z"/><path d="m204 631 6 8 6-8z"/><path d="m204 735 6 8 6-8z"/></g>
<rect x="20" y="885" width="380" height="170" rx="18" fill="#e6ede2"/><text x="44" y="923" fill="#6a873b" font-family="monospace" font-size="10">DATABASE PROVIDES BOTH</text><text x="44" y="960" fill="#10221e" font-family="Arial" font-size="15" font-weight="700">File locations + recipients</text><text x="44" y="991" fill="#52645a" font-family="Arial" font-size="12">Downstream processing continues</text><text x="44" y="1014" fill="#52645a" font-family="Arial" font-size="12">as part of a wider business flow.</text><text x="210" y="1090" text-anchor="middle" fill="#c2cfc5" font-family="monospace" font-size="9">NO INTERNAL PATHS OR ACTUAL COUNTS SHOWN</text><circle r="6" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="7s" repeatCount="indefinite" path="M210 201V223V229V327V333V431V437V535V541V639V645V743"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle><g transform="translate(0,-10)" visibility="hidden"><path d="M-7 0H3L8 5V21H-7Z" fill="#fcfcf7" stroke="#718c3d" stroke-width="1.3"/><path d="M3 0V5H8" fill="none" stroke="#718c3d" stroke-width="1.3"/><animateMotion begin="indefinite" dur="7s" repeatCount="indefinite" path="M210 201V223V229V327V333V431V437V535V541V639V645V743"/><set attributeName="visibility" to="visible" begin="indefinite"/></g></svg>
