<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 800" role="img" aria-labelledby="title desc">
  <title id="title">Mobile workflow run trace and outcome branches</title>
  <desc id="desc">A run is logged, status tracked and its output validated. Successful runs complete. Failed or stuck runs branch to investigation and notification.</desc>
  <defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0v22" fill="none" stroke="#d2f36b" stroke-opacity=".055"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8Z" fill="#d2f36b"/></marker><marker id="rust" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 7 4 0 8Z" fill="#d18a6f"/></marker></defs>
  <rect width="390" height="800" rx="18" fill="#10221e"/><rect width="390" height="800" rx="18" fill="url(#grid)"/>
  <text x="22" y="34" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing="1.1">TRACE THE RUN · VALIDATE THE RESULT</text>
  <path d="M58 86v389" stroke="#718c3d" stroke-width="2"/>
  <g fill="#29483d" stroke="#8ea45e" stroke-width="2"><circle cx="58" cy="114" r="23"/><circle cx="58" cy="224" r="23"/><circle cx="58" cy="334" r="23"/><circle cx="58" cy="444" r="23"/></g>
  <g fill="none" stroke="#d2f36b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M48 119h20M58 104v20"/><path d="M51 216h14v17H51zM54 221h8M54 226h8"/><ellipse cx="58" cy="326" rx="9" ry="4"/><path d="M49 326v15c0 6 18 6 18 0v-15"/><path d="m48 444 7 7 14-16"/></g>
  <g font-family="Arial,sans-serif"><text x="100" y="108" fill="#d2f36b" font-family="monospace" font-size="9">01 / EXECUTION</text><text x="100" y="132" fill="#fcfcf7" font-size="16" font-weight="700">Workflow run</text><text x="100" y="218" fill="#d2f36b" font-family="monospace" font-size="9">02 / LOGGING</text><text x="100" y="242" fill="#fcfcf7" font-size="16" font-weight="700">Run + step context</text><text x="100" y="328" fill="#d2f36b" font-family="monospace" font-size="9">03 / TRACKING</text><text x="100" y="352" fill="#fcfcf7" font-size="16" font-weight="700">Status records / views</text><text x="100" y="438" fill="#d2f36b" font-family="monospace" font-size="9">04 / VALIDATION</text><text x="100" y="462" fill="#fcfcf7" font-size="16" font-weight="700">Expected outcome</text></g>
  <path d="M58 468v35H110v22M58 503h222v22" fill="none" stroke="#718c3d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="22" y="542" width="162" height="92" rx="12" fill="#29483d" stroke="#8ea45e"/><rect x="202" y="542" width="166" height="92" rx="12" fill="#382d29" stroke="#b86e53"/>
  <text x="40" y="570" fill="#d2f36b" font-family="monospace" font-size="9">SUCCESS</text><text x="40" y="598" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="15" font-weight="700">Complete</text><text x="220" y="570" fill="#e0a38b" font-family="monospace" font-size="9">FAILED / STALLED</text><text x="220" y="598" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="15" font-weight="700">Investigate</text>
  <path d="M285 637v27" fill="none" stroke="#d18a6f" stroke-width="2" marker-end="url(#rust)"/>
  <rect x="202" y="676" width="166" height="70" rx="12" fill="#19352d" stroke="#536e5e"/>
  <text x="220" y="704" fill="#d2f36b" font-family="monospace" font-size="9">NEXT</text><text x="220" y="728" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="14" font-weight="700">Notify / remediate</text>
  <text x="22" y="780" fill="#a9b8ae" font-family="Arial,sans-serif" font-size="11">Tracking and recovery vary by workflow.</text>
</svg>
