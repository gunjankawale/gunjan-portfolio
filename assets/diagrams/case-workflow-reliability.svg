<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Workflow observability and outcome validation</title>
  <desc id="desc">A workflow run creates step-level logs and status records, then validates expected outputs. Success completes; failure or a stalled run branches to investigation and notification.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#1b382f"/><stop offset="1" stop-color="#10221e"/></linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0v26" fill="none" stroke="#d2f36b" stroke-opacity=".05"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#d2f36b"/></marker>
    <marker id="arrow-rust" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#d18a6f"/></marker>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#07110e" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1120" height="500" rx="22" fill="url(#night)"/><rect width="1120" height="500" rx="22" fill="url(#grid)"/>
  <text x="38" y="38" fill="#d2f36b" font-family="monospace" font-size="11" letter-spacing="2">RUN OBSERVABILITY / NO FABRICATED METRICS</text>
  <text x="1080" y="38" text-anchor="end" fill="#a9b8ae" font-family="monospace" font-size="10">STATUS · TRACE · VALIDATE</text>
  <path d="M36 60H1084" stroke="#8ca096" stroke-opacity=".25"/>
  <path d="M115 209H787" fill="none" stroke="#d2f36b" stroke-opacity=".55" stroke-width="2"/>
  <path d="M787 209C847 209 842 160 903 160H1018" fill="none" stroke="#d2f36b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M787 209C847 209 842 333 903 333H1018" fill="none" stroke="#d18a6f" stroke-width="2.5" marker-end="url(#arrow-rust)"/>
  <g filter="url(#shadow)">
    <circle cx="114" cy="209" r="42" fill="#254238" stroke="#d2f36b" stroke-width="2"/>
    <circle cx="329" cy="209" r="50" fill="#254238" stroke="#718c3d" stroke-width="2"/>
    <circle cx="556" cy="209" r="50" fill="#254238" stroke="#718c3d" stroke-width="2"/>
    <circle cx="786" cy="209" r="50" fill="#29483d" stroke="#d2f36b" stroke-width="2"/>
    <rect x="918" y="117" width="157" height="87" rx="14" fill="#29483d" stroke="#9fbc5d"/>
    <rect x="918" y="290" width="157" height="87" rx="14" fill="#382d29" stroke="#b86e53"/>
  </g>
  <g fill="none" stroke="#d2f36b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 218v-17l14-9 14 9v17M105 218v-10h18v10"/>
    <path d="M316 187h26v34h-26zM321 195h16M321 202h16M321 209h11"/>
    <ellipse cx="556" cy="194" rx="17" ry="7"/><path d="M539 194v28c0 9 34 9 34 0v-28m-34 9c0 9 34 9 34 0m-34 9c0 9 34 9 34 0"/>
    <path d="m775 210 8 8 16-19"/>
  </g>
  <g fill="#fcfcf7" font-family="Arial,sans-serif" text-anchor="middle"><text x="114" y="274" font-size="13" font-weight="700">Run starts</text><text x="329" y="279" font-size="13" font-weight="700">Step logs</text><text x="556" y="279" font-size="13" font-weight="700">Status tracking</text><text x="786" y="279" font-size="13" font-weight="700">Check output</text></g>
  <g fill="#bfcbbf" font-family="Arial,sans-serif" text-anchor="middle" font-size="11"><text x="329" y="294">run + action context</text><text x="556" y="294">SQL / dashboard views</text><text x="786" y="294">business outcome</text></g>
  <circle cx="329" cy="209" r="62" fill="none" stroke="#d2f36b" stroke-opacity=".16" stroke-dasharray="2 7"/><circle cx="556" cy="209" r="62" fill="none" stroke="#d2f36b" stroke-opacity=".16" stroke-dasharray="2 7"/>
  <text x="946" y="145" fill="#d2f36b" font-family="monospace" font-size="9" letter-spacing="1">SUCCESS</text><text x="946" y="171" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="15" font-weight="700">Complete</text><text x="946" y="188" fill="#c5d0c7" font-family="Arial,sans-serif" font-size="10">expected result checked</text>
  <text x="946" y="318" fill="#e0a38b" font-family="monospace" font-size="9" letter-spacing="1">FAILED / STALLED</text><text x="946" y="344" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="15" font-weight="700">Investigate</text><text x="946" y="361" fill="#d3bdb4" font-family="Arial,sans-serif" font-size="10">notify · remediate as needed</text>
  <text x="38" y="454" fill="#d2f36b" font-family="monospace" font-size="9" letter-spacing="1">TRACE THE RUN</text>
  <text x="38" y="477" fill="#c5d0c7" font-family="Arial,sans-serif" font-size="12">Start with status → locate the action → inspect context → verify the business output.</text>
</svg>
