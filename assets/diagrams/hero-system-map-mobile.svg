<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 590" role="img" aria-labelledby="title desc">
  <title id="title">Data systems and workflow orchestration map, mobile layout</title>
  <desc id="desc">Sources and file formats enter Azure Logic Apps, which connects to storage, file destinations and email. Individual workflow paths vary.</desc>
  <defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b382f"/><stop offset="1" stop-color="#10221e"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0 0 7 4 0 8Z" fill="#d2f36b"/></marker></defs>
  <rect width="390" height="590" rx="20" fill="url(#surface)"/><text x="22" y="34" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing="1.2">SYSTEMS I WORK ACROSS</text><text x="22" y="58" fill="#a9b8ae" font-family="monospace" font-size="9">CONCEPTUAL MAP · PATHS VARY</text>
  <rect x="22" y="82" width="346" height="94" rx="12" fill="#f4f3ec"/><text x="42" y="108" fill="#718b3b" font-family="monospace" font-size="10">SOURCES &amp; FORMATS</text><text x="42" y="139" fill="#10221e" font-family="Arial,sans-serif" font-size="18" font-weight="700">APIs · SQL Server · Files</text><text x="42" y="159" fill="#53645b" font-family="Arial,sans-serif" font-size="13">CSV · TXT · PDF</text>
  <path d="M195 176V214" stroke="#d2f36b" stroke-width="2" marker-end="url(#arrow)"/><circle cx="195" cy="195" r="3" fill="#d2f36b"/>
  <rect x="22" y="220" width="346" height="120" rx="14" fill="#263f35" stroke="#d2f36b" stroke-width="1.5"/><text x="195" y="250" text-anchor="middle" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing="1.1">WORKFLOW ORCHESTRATION</text><text x="195" y="282" text-anchor="middle" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="21" font-weight="700">Azure Logic Apps</text><text x="195" y="308" text-anchor="middle" fill="#c3d0c6" font-family="Arial,sans-serif" font-size="13">Develop · integrate · validate</text><text x="195" y="328" text-anchor="middle" fill="#c3d0c6" font-family="Arial,sans-serif" font-size="11">Workflow steps depend on requirements</text>
  <path d="M195 340V375" stroke="#d2f36b" stroke-width="2" marker-end="url(#arrow)"/><circle cx="195" cy="358" r="3" fill="#d2f36b"/>
  <rect x="22" y="382" width="346" height="154" rx="12" fill="#f4f3ec"/><text x="42" y="408" fill="#718b3b" font-family="monospace" font-size="10">DOWNSTREAM &amp; DELIVERY</text><path d="M48 428H65M48 428V505M48 466H65M48 505H65" stroke="#8fa27c" stroke-width="1.5"/><circle cx="48" cy="428" r="3" fill="#718b3b"/><circle cx="48" cy="466" r="3" fill="#718b3b"/><circle cx="48" cy="505" r="3" fill="#718b3b"/><text x="76" y="434" fill="#10221e" font-family="Arial,sans-serif" font-size="15" font-weight="700">Azure Blob Storage</text><text x="76" y="472" fill="#10221e" font-family="Arial,sans-serif" font-size="15" font-weight="700">File destinations</text><text x="76" y="511" fill="#10221e" font-family="Arial,sans-serif" font-size="15" font-weight="700">Email delivery</text>
  <text x="22" y="567" fill="#a9b8ae" font-family="monospace" font-size="9" letter-spacing=".7">INDIVIDUAL WORKFLOWS USE DIFFERENT PATHS</text>
  <circle r="6" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M195 176V214V340V375"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
</svg>
