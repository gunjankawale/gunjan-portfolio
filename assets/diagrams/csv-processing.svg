<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">New CSV to TXT workflow</title>
  <desc id="desc">An upstream process places a CSV in a configured hot folder. Azure Logic Apps triggers, archives the input at a business-designated location, calls SQL stored procedures to apply business rules, creates TXT outputs, delivers them to the required downstream destination and emails the output attachments to a static recipient list configured in Logic Apps.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#19352d"/><stop offset="1" stop-color="#10221e"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d2f36b"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#07110e" flood-opacity=".2"/></filter></defs>
  <rect width="1500" height="820" rx="26" fill="url(#bg)"/><path d="M42 88H1458M42 770H1458" stroke="#d9e3da" stroke-opacity=".18"/>
  <text x="56" y="57" fill="#d2f36b" font-family="monospace" font-size="15" letter-spacing="2">NEW CSV PROCESSING WORKFLOW</text><text x="1440" y="57" fill="#b6c4bb" font-family="monospace" font-size="12" text-anchor="end">FRESH BUSINESS REQUIREMENT · SANITIZED</text>
  <rect x="65" y="130" width="1370" height="580" rx="24" fill="#18382f" stroke="#d2f36b" stroke-opacity=".45" stroke-width="2"/><rect x="88" y="112" width="230" height="36" rx="18" fill="#d2f36b"/><text x="203" y="136" text-anchor="middle" fill="#10221e" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">LOGIC APPS ORCHESTRATION</text>
  <g filter="url(#shadow)" fill="#fcfcf7"><rect x="95" y="270" width="212" height="116" rx="16"/><rect x="360" y="270" width="212" height="116" rx="16"/><rect x="625" y="270" width="212" height="116" rx="16"/><rect x="890" y="270" width="212" height="116" rx="16"/><rect x="1155" y="270" width="212" height="116" rx="16"/><rect x="360" y="506" width="430" height="118" rx="16"/><rect x="890" y="506" width="477" height="118" rx="16"/></g>
  <g fill="#10221e" font-family="Arial,sans-serif">
    <text x="119" y="310" fill="#6a873b" font-family="monospace" font-size="10">UPSTREAM</text><text x="119" y="346" font-size="18" font-weight="700">CSV arrives</text><text x="119" y="369" fill="#5d6d64" font-size="12">from prior process</text>
    <text x="384" y="310" fill="#6a873b" font-family="monospace" font-size="10">CONFIGURED HOT FOLDER</text><text x="384" y="346" font-size="18" font-weight="700">File trigger</text><text x="384" y="369" fill="#5d6d64" font-size="12">starts Logic Apps</text>
    <text x="649" y="310" fill="#6a873b" font-family="monospace" font-size="10">INPUT FILE</text><text x="649" y="346" font-size="18" font-weight="700">Archive CSV</text><text x="649" y="369" fill="#5d6d64" font-size="12">business-set location</text>
    <text x="914" y="310" fill="#6a873b" font-family="monospace" font-size="10">BUSINESS RULES</text><text x="914" y="346" font-size="18" font-weight="700">SQL procedures</text><text x="914" y="369" fill="#5d6d64" font-size="12">apply required logic</text>
    <text x="1179" y="310" fill="#6a873b" font-family="monospace" font-size="10">OUTPUT</text><text x="1179" y="346" font-size="18" font-weight="700">TXT files</text><text x="1179" y="369" fill="#5d6d64" font-size="12">generated by workflow</text>
    <text x="389" y="548" fill="#6a873b" font-family="monospace" font-size="10">DOWNSTREAM HANDOFF</text><text x="389" y="585" font-size="18" font-weight="700">Required output destination</text><text x="389" y="608" fill="#5d6d64" font-size="12">Next process continues the wider business flow</text>
    <text x="919" y="548" fill="#6a873b" font-family="monospace" font-size="10">EMAIL DELIVERY</text><text x="919" y="585" font-size="18" font-weight="700">TXT attachments · static recipients</text><text x="919" y="608" fill="#5d6d64" font-size="12">Recipient list configured in Logic Apps</text>
  </g>
  <g fill="none" stroke="#d2f36b" stroke-width="3" marker-end="url(#arrow)"><path d="M307 328H350"/><path d="M572 328H615"/><path d="M837 328H880"/><path d="M1102 328H1145"/><path d="M1260 386V445H575V496"/><path d="M1260 386V455H1128V496"/></g>
  <g fill="#d2f36b"><circle cx="329" cy="328" r="5"/><circle cx="594" cy="328" r="5"/><circle cx="859" cy="328" r="5"/><circle cx="1124" cy="328" r="5"/></g>
  <text x="750" y="746" text-anchor="middle" fill="#c2cfc5" font-family="monospace" font-size="11" letter-spacing="1">ONE STAGE IN A LARGER PROCESS · LOCATIONS ARE SET BY BUSINESS REQUIREMENTS</text>
  <circle r="7" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="8s" repeatCount="indefinite" path="M307 328H350H572H615H837H880H1102H1145"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <circle r="5" fill="#fcfcf7" stroke="#718c3d" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M1260 386V445H575V496"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <circle r="5" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M1260 386V455H1128V496"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <g transform="translate(0,-12)" visibility="hidden"><path d="M-9 0H4L10 6V24H-9Z" fill="#d2f36b" stroke="#10221e" stroke-width="1.5"/><path d="M4 0V6H10" fill="none" stroke="#10221e" stroke-width="1.5"/><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M1260 386V445H575V496"/><set attributeName="visibility" to="visible" begin="indefinite"/></g>
  <g fill="none" stroke="#d2f36b" stroke-width="3"><rect x="91" y="266" width="220" height="124" rx="18" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="indefinite" repeatCount="1"/></rect><rect x="356" y="266" width="220" height="124" rx="18" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="indefinite" repeatCount="1"/></rect><rect x="621" y="266" width="220" height="124" rx="18" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="indefinite" repeatCount="1"/></rect><rect x="886" y="266" width="220" height="124" rx="18" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="indefinite" repeatCount="1"/></rect><rect x="1151" y="266" width="220" height="124" rx="18" opacity="0"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="indefinite" repeatCount="1"/></rect></g>
</svg>
