<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1270" role="img" aria-labelledby="title desc">
<title id="title">API-driven report workflow, mobile sequence</title><desc id="desc">Logic Apps schedules and sends a dynamic API request to a Function App. The Function App performs its own processing, creates CSV reports in Blob Storage and returns PASS or FAIL. Logic Apps evaluates that status. PASS continues to destination transfer and customer email; FAIL logs dashboard failure and takes configured actions.</desc>
<rect width="420" height="1270" rx="24" fill="#10221e"/><text x="24" y="45" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing=".8">ONE MIGRATED API REPORTING WORKFLOW</text>
<rect x="20" y="70" width="380" height="220" rx="18" fill="#18382f" stroke="#d2f36b" stroke-width="2"/><text x="42" y="103" fill="#d2f36b" font-family="monospace" font-size="10">AZURE LOGIC APPS</text>
<rect x="42" y="121" width="336" height="62" rx="12" fill="#fcfcf7"/><text x="62" y="147" fill="#6a873b" font-family="monospace" font-size="9">SCHEDULED TRIGGER</text><text x="62" y="170" fill="#10221e" font-family="Arial" font-size="15" font-weight="700">Start workflow</text>
<path d="M210 183v22" stroke="#d2f36b" stroke-width="2.5"/><path d="m204 197 6 8 6-8z" fill="#d2f36b"/>
<rect x="42" y="211" width="336" height="58" rx="12" fill="#fcfcf7"/><text x="62" y="237" fill="#6a873b" font-family="monospace" font-size="9">API REQUEST</text><text x="62" y="259" fill="#10221e" font-family="Arial" font-size="15" font-weight="700">Dynamic payload</text>
<path d="M210 290v28" stroke="#d2f36b" stroke-width="2.5"/><path d="m204 310 6 8 6-8z" fill="#d2f36b"/><text x="226" y="309" fill="#d2f36b" font-family="monospace" font-size="9">REQUEST</text>
<rect x="20" y="327" width="380" height="165" rx="18" fill="#e6ede2"/><text x="42" y="362" fill="#6a873b" font-family="monospace" font-size="10">FUNCTION APP · SEPARATE PROCESSING</text><text x="42" y="400" fill="#10221e" font-family="Arial" font-size="19" font-weight="700">Runs its own underlying logic</text><text x="42" y="431" fill="#52645a" font-family="Arial" font-size="13">Generates reports and returns an API status.</text><text x="42" y="454" fill="#52645a" font-family="Arial" font-size="12">I call the API; I did not write its code.</text><text x="42" y="478" fill="#6a873b" font-family="monospace" font-size="9">TWO DISTINCT OUTPUTS</text>
<path d="M210 492v26h-100v14M210 518h100v14" fill="none" stroke="#d2f36b" stroke-width="2.5"/><path d="m104 524 12 0-6 8z" fill="#d2f36b"/><path d="m304 524 12 0-6 8z" fill="#d2f36b"/>
<rect x="20" y="535" width="180" height="132" rx="15" fill="#fcfcf7"/><text x="38" y="568" fill="#6a873b" font-family="monospace" font-size="8.5">AZURE BLOB STORAGE</text><text x="38" y="601" fill="#10221e" font-family="Arial" font-size="15" font-weight="700">CSV reports</text><text x="38" y="625" fill="#52645a" font-family="Arial" font-size="11">Written by the</text><text x="38" y="644" fill="#52645a" font-family="Arial" font-size="11">Function App</text>
<rect x="220" y="535" width="180" height="132" rx="15" fill="#fcfcf7" stroke="#b8c6b8" stroke-width="2"/><text x="238" y="568" fill="#6a873b" font-family="monospace" font-size="8.5">API RESPONSE</text><text x="238" y="601" fill="#10221e" font-family="Arial" font-size="15" font-weight="700">PASS / FAIL</text><text x="238" y="625" fill="#52645a" font-family="Arial" font-size="11">Returned status</text><text x="238" y="644" fill="#52645a" font-family="Arial" font-size="11">to Logic Apps</text>
<path d="M310 667v32h-100v9" fill="none" stroke="#9bb9a1" stroke-width="2.5" stroke-dasharray="5 5"/><path d="m204 701 12 0-6 8z" fill="#9bb9a1"/><text x="321" y="688" fill="#c2cfc5" font-family="monospace" font-size="8">RESPONSE</text>
<rect x="20" y="714" width="380" height="128" rx="16" fill="#fcfcf7" stroke="#d2f36b" stroke-width="2"/><text x="42" y="749" fill="#6a873b" font-family="monospace" font-size="9">LOGIC APPS · STATUS EVALUATION</text><text x="42" y="785" fill="#10221e" font-family="Arial" font-size="17" font-weight="700">Apply workflow business rules</text><text x="42" y="812" fill="#52645a" font-family="Arial" font-size="10">API FAIL does not automatically throw an Azure error.</text>
<path d="M210 842v20H110v10M210 862h100v10" fill="none" stroke="#d2f36b" stroke-width="2.5"/><path d="m104 866 12 0-6 8z" fill="#d2f36b"/><path d="m304 866 12 0-6 8z" fill="#d2f36b"/>
<rect x="20" y="872" width="180" height="177" rx="15" fill="#e6eee1"/><text x="40" y="908" fill="#6a873b" font-family="monospace" font-size="9">ON PASS</text><text x="40" y="944" fill="#10221e" font-family="Arial" font-size="15" font-weight="700">Transfer reports</text><text x="40" y="966" fill="#10221e" font-family="Arial" font-size="15" font-weight="700">to destination</text><text x="40" y="1003" fill="#52645a" font-family="Arial" font-size="12">Customer email</text><text x="40" y="1024" fill="#52645a" font-family="Arial" font-size="10">Dynamic content · static</text><text x="40" y="1040" fill="#52645a" font-family="Arial" font-size="10">recipients</text>
<rect x="220" y="872" width="180" height="177" rx="15" fill="#4a3931" stroke="#d18b68"/><text x="240" y="908" fill="#ffbd9b" font-family="monospace" font-size="9">ON FAIL</text><text x="240" y="944" fill="#fcfcf7" font-family="Arial" font-size="15" font-weight="700">Dashboard failure</text><text x="240" y="966" fill="#fcfcf7" font-family="Arial" font-size="15" font-weight="700">log + configured</text><text x="240" y="988" fill="#fcfcf7" font-family="Arial" font-size="15" font-weight="700">business actions</text><text x="240" y="1025" fill="#e1d2ca" font-family="Arial" font-size="10">May include failing the</text><text x="240" y="1041" fill="#e1d2ca" font-family="Arial" font-size="10">workflow or sending alert.</text>
<rect x="20" y="1080" width="380" height="144" rx="16" fill="#e6ede2"/><text x="42" y="1116" fill="#6a873b" font-family="monospace" font-size="9">SHARED TRY / CATCH BOUNDARY</text><text x="42" y="1153" fill="#10221e" font-family="Arial" font-size="14" font-weight="700">An Azure action error inside Try goes</text><text x="42" y="1176" fill="#10221e" font-family="Arial" font-size="14" font-weight="700">to the shared Catch wrapper separately.</text>
<circle r="6" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M210 183V205V211V269V290V318V327V492V518H110V535"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
<circle r="5" fill="#fcfcf7" stroke="#718c3d" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M210 492V518H310V535"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
<circle r="5" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M310 667V699H210V714"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
<g transform="translate(0,-11)" visibility="hidden"><path d="M-8 0H4L9 5V22H-8Z" fill="#d2f36b" stroke="#10221e" stroke-width="1.3"/><path d="M4 0V5H9" fill="none" stroke="#10221e" stroke-width="1.3"/><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M210 492V518H110V535"/><set attributeName="visibility" to="visible" begin="indefinite"/></g>
</svg>
