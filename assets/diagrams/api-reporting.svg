<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">API-driven reporting workflow</title>
  <desc id="desc">Logic Apps schedules an API request with dynamic payload values. The Function App performs its own processing, writes CSV reports to Blob Storage and returns PASS or FAIL. Logic Apps evaluates the status under business rules. PASS continues with destination transfer and customer email using dynamic content and static recipients. FAIL follows configured business actions and dashboard logging. Action errors in Try use the shared Catch wrapper separately.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#19352d"/><stop offset="1" stop-color="#10221e"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d2f36b"/></marker><marker id="failArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#e6a283"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#07110e" flood-opacity=".2"/></filter></defs>
  <rect width="1400" height="900" rx="26" fill="url(#bg)"/><path d="M42 88H1358M42 850H1358" stroke="#d9e3da" stroke-opacity=".18"/>
  <text x="56" y="57" fill="#d2f36b" font-family="monospace" font-size="15" letter-spacing="2">API-DRIVEN REPORTING · ONE MIGRATED WORKFLOW</text><text x="1340" y="57" fill="#b6c4bb" font-family="monospace" font-size="12" text-anchor="end">CONCEPTUAL · SANITIZED</text>
  <rect x="52" y="126" width="920" height="678" rx="22" fill="#18382f" stroke="#d2f36b" stroke-opacity=".65" stroke-width="2"/><rect x="75" y="108" width="205" height="36" rx="18" fill="#d2f36b"/><text x="177" y="132" text-anchor="middle" fill="#10221e" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">AZURE LOGIC APPS</text>
  <rect x="1010" y="150" width="330" height="193" rx="20" fill="#e6ede2" stroke="#b8c6b8" stroke-width="2"/><rect x="1010" y="420" width="330" height="146" rx="20" fill="#fcfcf7" stroke="#b8c6b8" stroke-width="2"/>
  <text x="1036" y="188" fill="#6a873b" font-family="monospace" font-size="11" letter-spacing="1">SEPARATE PROCESSING</text><text x="1036" y="228" fill="#10221e" font-family="Arial,sans-serif" font-size="23" font-weight="700">Function App</text><text x="1036" y="261" fill="#52645a" font-family="Arial,sans-serif" font-size="14">Executes its own underlying logic</text><text x="1036" y="287" fill="#52645a" font-family="Arial,sans-serif" font-size="13">I call the API; I did not write its code</text><text x="1036" y="322" fill="#6a873b" font-family="monospace" font-size="10">GENERATES REPORTS</text>
  <text x="1036" y="458" fill="#6a873b" font-family="monospace" font-size="10" letter-spacing="1">AZURE BLOB STORAGE</text><text x="1036" y="493" fill="#10221e" font-family="Arial,sans-serif" font-size="19" font-weight="700">Generated CSV reports</text><text x="1036" y="523" fill="#52645a" font-family="Arial,sans-serif" font-size="13">Written by the Function App</text>
  <g filter="url(#shadow)" fill="#fcfcf7"><rect x="92" y="190" width="222" height="112" rx="16"/><rect x="365" y="190" width="250" height="112" rx="16"/><rect x="520" y="385" width="420" height="112" rx="16"/><rect x="92" y="580" width="410" height="183" rx="18"/><rect x="545" y="580" width="395" height="183" rx="18" fill="#4a3931" stroke="#d18b68" stroke-width="2"/></g>
  <g fill="#10221e" font-family="Arial,sans-serif"><text x="118" y="231" fill="#6a873b" font-family="monospace" font-size="10" letter-spacing="1">SCHEDULE</text><text x="118" y="267" font-size="19" font-weight="700">Start workflow</text><text x="391" y="231" fill="#6a873b" font-family="monospace" font-size="10" letter-spacing="1">API REQUEST</text><text x="391" y="267" font-size="19" font-weight="700">Dynamic payload</text><text x="548" y="425" fill="#6a873b" font-family="monospace" font-size="10" letter-spacing="1">API RESPONSE · STATUS EVALUATION</text><text x="548" y="464" font-size="19" font-weight="700">PASS / FAIL · Logic Apps business rules</text><text x="118" y="621" fill="#6a873b" font-family="monospace" font-size="10" letter-spacing="1">ON PASS</text><text x="118" y="656" font-size="18" font-weight="700">Continue required processing</text><text x="118" y="687" fill="#52645a" font-size="14">Transfer generated files to required destination</text><text x="118" y="718" fill="#52645a" font-size="14">Customer email · dynamic content · static recipients</text><text x="571" y="621" fill="#ffbd9b" font-family="monospace" font-size="10" letter-spacing="1">ON FAIL</text><text x="571" y="656" fill="#fcfcf7" font-size="18" font-weight="700">Configured business failure actions</text><text x="571" y="687" fill="#e1d2ca" font-size="14">Dashboard failure log; actions depend on need</text><text x="571" y="718" fill="#e1d2ca" font-size="13">May include workflow failure and an email alert</text></g>
  <g fill="none" stroke="#d2f36b" stroke-width="3" marker-end="url(#arrow)"><path d="M314 246H355"/><path d="M615 246H1000"/><path d="M1010 305H978V365H900V375"/><path d="M1175 343V410"/><path d="M1010 500H985V545H300V570"/></g>
  <path d="M730 497V535H742V570" fill="none" stroke="#e6a283" stroke-width="3" marker-end="url(#failArrow)"/>
  <text x="790" y="228" fill="#d2f36b" font-family="monospace" font-size="10">REQUEST</text><text x="890" y="355" fill="#b6c4bb" font-family="monospace" font-size="10">RESPONSE</text><text x="977" y="535" text-anchor="end" fill="#d2f36b" font-family="monospace" font-size="10">REPORT FILES</text>
  <rect x="89" y="785" width="855" height="42" rx="21" fill="#e6ede2"/><text x="516" y="812" text-anchor="middle" fill="#344a3d" font-family="Arial,sans-serif" font-size="13">An API FAIL is evaluated by workflow logic; it does not automatically throw an Azure action error.</text>
  <text x="700" y="876" text-anchor="middle" fill="#c2cfc5" font-family="monospace" font-size="10" letter-spacing=".7">A FAILED AZURE ACTION INSIDE TRY USES THE SHARED CATCH WRAPPER · A SEPARATE FAILURE PATH</text>
  <circle r="7" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="4s" repeatCount="indefinite" path="M615 246H1000"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <circle r="6" fill="#fcfcf7" stroke="#718c3d" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="4s" repeatCount="indefinite" path="M1010 305H978V365H900V375"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <circle r="6" fill="#e6a283" stroke="#4a3931" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M730 497V535H742V570"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <circle r="6" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M1175 343V410"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <g transform="translate(0,-12)" visibility="hidden"><path d="M-9 0H4L10 6V24H-9Z" fill="#d2f36b" stroke="#10221e" stroke-width="1.5"/><path d="M4 0V6H10" fill="none" stroke="#10221e" stroke-width="1.5"/><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M1010 500H985V545H300V570"/><set attributeName="visibility" to="visible" begin="indefinite"/></g>
  <g fill="none" stroke="#d2f36b" stroke-width="3" opacity="0"><rect x="88" y="186" width="230" height="120" rx="18"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="indefinite" repeatCount="1"/></rect><rect x="360" y="186" width="260" height="120" rx="18"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="indefinite" repeatCount="1"/></rect><rect x="515" y="381" width="430" height="120" rx="18"><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="indefinite" repeatCount="1"/></rect></g>
</svg>
