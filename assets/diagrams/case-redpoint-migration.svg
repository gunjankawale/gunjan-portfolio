<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Redpoint to Azure Logic Apps workflow migration</title>
  <desc id="desc">Two aligned workflow tracks carry the same business rules from legacy Redpoint to Azure Logic Apps. Their outputs flow into a visual reconciliation check and validation.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf9f2"/><stop offset="1" stop-color="#e9eee3"/></linearGradient>
    <linearGradient id="bridge" x2="0" y2="1"><stop stop-color="#d2f36b" stop-opacity=".25"/><stop offset="1" stop-color="#d2f36b" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#718c3d" stroke-opacity=".09"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#718c3d"/></marker>
    <marker id="arrow-dark" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#10221e"/></marker>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#10221e" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1120" height="500" rx="22" fill="url(#paper)"/><rect width="1120" height="500" rx="22" fill="url(#grid)"/>
  <text x="38" y="38" fill="#6f8f39" font-family="monospace" font-size="11" letter-spacing="2">SYSTEM TRANSITION / CONCEPTUAL VIEW</text>
  <text x="1080" y="38" text-anchor="end" fill="#718078" font-family="monospace" font-size="10">~7–8 WORKFLOWS</text>
  <path d="M36 58H1084" stroke="#cbd4c8"/>
  <rect x="38" y="82" width="840" height="156" rx="18" fill="#f0f1e9" stroke="#d7ddd2"/>
  <rect x="38" y="268" width="840" height="156" rx="18" fill="#e6eddb" stroke="#c9d5b9"/>
  <text x="60" y="110" fill="#718078" font-family="monospace" font-size="10" letter-spacing="1.4">LEGACY / REDPOINT</text>
  <text x="60" y="296" fill="#58722f" font-family="monospace" font-size="10" letter-spacing="1.4">MIGRATED / AZURE LOGIC APPS</text>
  <path d="M154 176H816" fill="none" stroke="#aab5a9" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M154 362H816" fill="none" stroke="#718c3d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <circle cx="172" cy="176" r="27" fill="#fcfcf7" stroke="#aab5a9" stroke-width="2"/><circle cx="376" cy="176" r="27" fill="#fcfcf7" stroke="#aab5a9" stroke-width="2"/><circle cx="580" cy="176" r="27" fill="#fcfcf7" stroke="#aab5a9" stroke-width="2"/><circle cx="784" cy="176" r="27" fill="#fcfcf7" stroke="#aab5a9" stroke-width="2"/>
    <circle cx="172" cy="362" r="27" fill="#fcfcf7" stroke="#8ea45e" stroke-width="2"/><circle cx="376" cy="362" r="27" fill="#fcfcf7" stroke="#8ea45e" stroke-width="2"/><circle cx="580" cy="362" r="27" fill="#fcfcf7" stroke="#8ea45e" stroke-width="2"/><circle cx="784" cy="362" r="27" fill="#fcfcf7" stroke="#8ea45e" stroke-width="2"/>
  </g>
  <g fill="none" stroke="#52645a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M164 176h16m-8-8v16"/><path d="M367 168h18v16h-18zM371 164h10"/><ellipse cx="580" cy="168" rx="10" ry="4"/><path d="M570 168v14c0 5 20 5 20 0v-14m-20 7c0 5 20 5 20 0"/><path d="M777 165h13l7 7v14h-20zM790 165v8h7"/>
    <path d="M164 362h16m-8-8v16"/><path d="M367 354h18v16h-18zM371 350h10"/><ellipse cx="580" cy="354" rx="10" ry="4"/><path d="M570 354v14c0 5 20 5 20 0v-14m-20 7c0 5 20 5 20 0"/><path d="M777 351h13l7 7v14h-20zM790 351v8h7"/>
  </g>
  <g fill="#46584f" font-family="Arial,sans-serif" text-anchor="middle"><text x="172" y="219" font-size="12" font-weight="700">Trigger</text><text x="376" y="219" font-size="12" font-weight="700">Business logic</text><text x="580" y="219" font-size="12" font-weight="700">SQL · if used</text><text x="784" y="219" font-size="12" font-weight="700">Output</text><text x="172" y="405" font-size="12" font-weight="700">Trigger</text><text x="376" y="405" font-size="12" font-weight="700">Same logic</text><text x="580" y="405" font-size="12" font-weight="700">SQL · if used</text><text x="784" y="405" font-size="12" font-weight="700">Output</text></g>
  <path d="M376 205V333" stroke="#96a480" stroke-dasharray="3 6"/><path d="M376 238v30" stroke="#718c3d" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="301" y="246" width="150" height="28" rx="14" fill="#d2f36b"/><text x="376" y="264" text-anchor="middle" fill="#263b30" font-family="monospace" font-size="9" letter-spacing=".5">PRESERVE RULES</text>
  <path d="M811 176C868 176 872 207 907 223M811 362C868 362 872 330 907 314" fill="none" stroke="#10221e" stroke-width="2" marker-end="url(#arrow-dark)"/>
  <rect x="911" y="151" width="171" height="235" rx="17" fill="#10221e" filter="url(#shadow)"/>
  <text x="932" y="181" fill="#d2f36b" font-family="monospace" font-size="9" letter-spacing="1">RECONCILE</text>
  <text x="932" y="208" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="18" font-weight="700">Compare</text>
  <text x="932" y="229" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="18" font-weight="700">outputs</text>
  <path d="M932 244H1060" stroke="#526b5b"/>
  <g fill="#c9d5c6"><rect x="932" y="260" width="18" height="6" rx="3"/><rect x="957" y="260" width="70" height="6" rx="3"/><rect x="1035" y="260" width="25" height="6" rx="3"/><rect x="932" y="274" width="18" height="6" rx="3"/><rect x="957" y="274" width="70" height="6" rx="3"/><rect x="1035" y="274" width="25" height="6" rx="3"/><rect x="932" y="288" width="18" height="6" rx="3"/><rect x="957" y="288" width="70" height="6" rx="3"/><rect x="1035" y="288" width="25" height="6" rx="3"/></g>
  <circle cx="1045" cy="311" r="13" fill="#d2f36b"/><path d="m1039 311 4 4 8-9" fill="none" stroke="#10221e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="932" y="345" fill="#c5d0c7" font-family="Arial,sans-serif" font-size="11">Test · validate · resolve</text>
  <text x="38" y="468" fill="#697871" font-family="Arial,sans-serif" font-size="12">Representative steps only. Triggers and SQL actions vary; the legacy process remains the behavioral reference.</text>
  <circle r="7" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="7s" repeatCount="indefinite" path="M154 362H816C868 362 872 330 907 314"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
  <circle r="5" fill="#fcfcf7" stroke="#718c3d" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="7s" repeatCount="indefinite" path="M154 176H816C868 176 872 207 907 223"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
</svg>
