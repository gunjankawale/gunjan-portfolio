<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Distinct CSV, TXT and PDF workflow paths</title>
  <desc id="desc">A green CSV path runs through Logic Apps and SQL stored-procedure rules, archives the input and produces TXT files. A separate rust-colored PDF path shows file movement, archiving and email attachment handling without content extraction.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#faf9f2"/><stop offset="1" stop-color="#eeeee5"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#718c3d" stroke-opacity=".08"/></pattern>
    <marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#718c3d"/></marker>
    <marker id="rust" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#a4573b"/></marker>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#10221e" flood-opacity=".1"/></filter>
  </defs>
  <rect width="1120" height="560" rx="22" fill="url(#paper)"/><rect width="1120" height="560" rx="22" fill="url(#grid)"/>
  <text x="38" y="38" fill="#6f8f39" font-family="monospace" font-size="11" letter-spacing="2">FORMAT-SPECIFIC WORKFLOWS</text>
  <text x="1080" y="38" text-anchor="end" fill="#718078" font-family="monospace" font-size="10">DIFFERENT PATHS · NOT ONE PIPELINE</text>
  <path d="M36 60H1084" stroke="#cbd4c8"/>
  <rect x="38" y="83" width="1044" height="258" rx="18" fill="#e8eddf" stroke="#d1dbc6"/>
  <text x="62" y="112" fill="#58722f" font-family="monospace" font-size="10" letter-spacing="1.5">CSV INPUT / SQL RULES / TXT OUTPUT</text>
  <path d="M178 216H914" fill="none" stroke="#718c3d" stroke-width="3" marker-end="url(#green)"/>
  <g filter="url(#shadow)">
    <circle cx="174" cy="216" r="55" fill="#fcfcf7" stroke="#a8bc83" stroke-width="2"/>
    <path d="M158 185h24l11 11v48h-35zM182 185v12h11M165 207h20M165 216h20M165 225h13" fill="none" stroke="#58722f" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="422" cy="216" r="55" fill="#fcfcf7" stroke="#a8bc83" stroke-width="2"/>
    <rect x="395" y="194" width="54" height="39" rx="7" fill="#f1f4e9" stroke="#718c3d"/><path d="M403 205h38M403 214h38M403 223h24" stroke="#718c3d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="670" cy="216" r="55" fill="#fcfcf7" stroke="#a8bc83" stroke-width="2"/>
    <path d="M652 197v35m36-35v35M652 205h36M652 224h36" stroke="#718c3d" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="918" cy="216" r="55" fill="#fcfcf7" stroke="#a8bc83" stroke-width="2"/>
    <path d="M903 192h22l10 10v38h-32zM925 192v11h10M908 213h21M908 222h21" fill="none" stroke="#58722f" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g fill="#263b30" font-family="Arial,sans-serif" text-anchor="middle"><text x="174" y="290" font-size="13" font-weight="700">CSV trigger</text><text x="422" y="290" font-size="13" font-weight="700">Logic Apps</text><text x="670" y="290" font-size="13" font-weight="700">SQL procedures</text><text x="918" y="290" font-size="13" font-weight="700">TXT outputs</text></g>
  <g fill="#718078" font-family="Arial,sans-serif" text-anchor="middle" font-size="11"><text x="174" y="309">incoming file</text><text x="422" y="309">business rules</text><text x="670" y="309">where applicable</text><text x="918" y="309">generated output</text></g>
  <path d="M670 273C670 330 541 334 541 366" fill="none" stroke="#718c3d" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#green)"/>
  <rect x="449" y="370" width="184" height="32" rx="16" fill="#d2f36b"/><text x="541" y="391" text-anchor="middle" fill="#263b30" font-family="monospace" font-size="9" letter-spacing=".5">ARCHIVE THE SOURCE CSV</text>
  <path d="M38 424H1082" stroke="#d3d9ce" stroke-dasharray="3 7"/>
  <rect x="38" y="444" width="1044" height="84" rx="16" fill="#f1e5df" stroke="#dfc2b6"/>
  <path d="M212 486H324M535 486H698" fill="none" stroke="#a4573b" stroke-width="2.5" marker-end="url(#rust)"/>
  <path d="M82 462h28l12 12v34H82zM110 462v13h12M89 483h23M89 491h23" fill="none" stroke="#a4573b" stroke-width="2" stroke-linejoin="round"/>
  <text x="142" y="493" fill="#402b26" font-family="Arial,sans-serif" font-size="14" font-weight="700">PDF file</text>
  <text x="347" y="481" fill="#a4573b" font-family="monospace" font-size="9">SEPARATE FLOW</text><text x="347" y="502" fill="#402b26" font-family="Arial,sans-serif" font-size="14" font-weight="700">Move or archive</text>
  <path d="m725 471 24 18 24-18M725 471v29h48v-29" fill="none" stroke="#a4573b" stroke-width="2" stroke-linejoin="round"/>
  <text x="792" y="481" fill="#a4573b" font-family="monospace" font-size="9">DELIVERY</text><text x="792" y="502" fill="#402b26" font-family="Arial,sans-serif" font-size="14" font-weight="700">Email attachment handling</text>
  <text x="1080" y="548" text-anchor="end" fill="#697871" font-family="Arial,sans-serif" font-size="11">PDF file handling shown; document content extraction is not implied.</text>
</svg>
