<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 860" role="img" aria-labelledby="title desc">
<title id="title">Database-driven TXT and PDF file routing</title><desc id="desc">A file trigger starts Logic Apps, which reads routing and email configuration from a database, identifies TXT and PDF files, moves them to database-configured output and archive destinations, and sends a success email with dynamic format counts to database-sourced recipients. Wider downstream work continues separately.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#19352d"/><stop offset="1" stop-color="#10221e"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#d2f36b"/></marker><marker id="configArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#9bb9a1"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#07110e" flood-opacity=".2"/></filter></defs>
<rect width="1500" height="860" rx="26" fill="url(#bg)"/><path d="M42 88H1458M42 812H1458" stroke="#d9e3da" stroke-opacity=".18"/>
<text x="56" y="57" fill="#d2f36b" font-family="monospace" font-size="15" letter-spacing="2">DATABASE-DRIVEN FILE ROUTING &amp; DELIVERY</text><text x="1440" y="57" fill="#b6c4bb" font-family="monospace" font-size="12" text-anchor="end">SEPARATE WORKFLOW · SANITIZED</text>
<rect x="62" y="130" width="1110" height="574" rx="22" fill="#18382f" stroke="#d2f36b" stroke-opacity=".55" stroke-width="2"/><rect x="84" y="112" width="192" height="36" rx="18" fill="#d2f36b"/><text x="180" y="136" text-anchor="middle" fill="#10221e" font-family="monospace" font-size="12" font-weight="700">LOGIC APPS ORCHESTRATION</text>
<rect x="1210" y="156" width="235" height="250" rx="20" fill="#e6ede2" stroke="#b8c6b8" stroke-width="2"/><text x="1234" y="194" fill="#6a873b" font-family="monospace" font-size="10" letter-spacing="1">CONFIGURATION SOURCE</text><text x="1234" y="231" fill="#10221e" font-family="Arial,sans-serif" font-size="22" font-weight="700">Database</text><text x="1234" y="270" fill="#52645a" font-family="Arial,sans-serif" font-size="14">Routing locations</text><text x="1234" y="296" fill="#52645a" font-family="Arial,sans-serif" font-size="14">Email recipients</text><path d="M1234 323H1420" stroke="#bdc9bd"/><text x="1234" y="356" fill="#6a873b" font-family="monospace" font-size="10">LOOKED UP AT RUN TIME</text>
<g filter="url(#shadow)" fill="#fcfcf7"><rect x="98" y="236" width="220" height="112" rx="16"/><rect x="358" y="236" width="220" height="112" rx="16"/><rect x="618" y="236" width="236" height="112" rx="16"/><rect x="894" y="236" width="224" height="112" rx="16"/><rect x="160" y="474" width="270" height="126" rx="16"/><rect x="462" y="474" width="270" height="126" rx="16"/><rect x="764" y="474" width="354" height="126" rx="16"/></g>
<g fill="#10221e" font-family="Arial,sans-serif"><text x="123" y="277" fill="#6a873b" font-family="monospace" font-size="10">INPUT FOLDER</text><text x="123" y="312" font-size="18" font-weight="700">File arrives</text><text x="383" y="277" fill="#6a873b" font-family="monospace" font-size="10">FILE TRIGGER</text><text x="383" y="312" font-size="18" font-weight="700">Logic Apps starts</text><text x="643" y="277" fill="#6a873b" font-family="monospace" font-size="10">CONFIG LOOKUP</text><text x="643" y="312" font-size="18" font-weight="700">Read database rules</text><text x="919" y="277" fill="#6a873b" font-family="monospace" font-size="10">FILE IDENTIFICATION</text><text x="919" y="312" font-size="18" font-weight="700">TXT and PDF</text>
<text x="184" y="513" fill="#6a873b" font-family="monospace" font-size="10">OUTPUT ROUTE</text><text x="184" y="551" font-size="17" font-weight="700">Configured destination</text><text x="184" y="577" fill="#5d6d64" font-size="12">Location from database</text><text x="486" y="513" fill="#6a873b" font-family="monospace" font-size="10">ARCHIVE ROUTE</text><text x="486" y="551" font-size="17" font-weight="700">Configured archive</text><text x="486" y="577" fill="#5d6d64" font-size="12">Location from database</text><text x="788" y="513" fill="#6a873b" font-family="monospace" font-size="10">SUCCESS EMAIL</text><text x="788" y="551" font-size="17" font-weight="700">Dynamic TXT / PDF counts</text><text x="788" y="577" fill="#5d6d64" font-size="12">Recipients from database</text></g>
<g fill="none" stroke="#d2f36b" stroke-width="3" marker-end="url(#arrow)"><path d="M318 292H348"/><path d="M578 292H608"/><path d="M854 292H884"/><path d="M1006 348V422H295V464"/><path d="M1006 348V430H597V464"/><path d="M1006 348V438H941V464"/></g>
<path d="M1210 277H1190V202H735V226" fill="none" stroke="#9bb9a1" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#configArrow)"/><path d="M1327 406V446H941V464" fill="none" stroke="#9bb9a1" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#configArrow)"/>
<rect x="417" y="648" width="700" height="42" rx="21" fill="#e6ede2"/><text x="767" y="675" text-anchor="middle" fill="#344a3d" font-family="Arial,sans-serif" font-size="13">The files are handed off; wider downstream processing continues separately.</text>
<text x="750" y="792" text-anchor="middle" fill="#c2cfc5" font-family="monospace" font-size="11" letter-spacing=".8">DATABASE SUPPLIES FILE LOCATIONS AND RECIPIENTS · NO INTERNAL PATHS OR ACTUAL COUNTS SHOWN</text>
<circle r="7" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="7s" repeatCount="indefinite" path="M318 292H348H578H608H854H884H1006V422H295V464"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
<circle r="6" fill="#9bb9a1" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="6s" repeatCount="indefinite" path="M1210 277H1190V202H735V226"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
<circle r="5" fill="#fcfcf7" stroke="#718c3d" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="5s" repeatCount="indefinite" path="M1006 348V438H941V464"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle>
