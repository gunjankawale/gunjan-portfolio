<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">Logic Apps API request, response and file delivery</title>
  <desc id="desc">Logic Apps sends a dynamic request to a separately developed Azure Function App API. The function generates files in Blob Storage and returns a response. Logic Apps continues with file movement and a dynamic email.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#1b382f"/><stop offset="1" stop-color="#10221e"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" fill="none" stroke="#d2f36b" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#d2f36b"/></marker>
    <marker id="arrow-sage" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 8 4.5 0 9Z" fill="#a9b8ae"/></marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1120" height="500" rx="22" fill="url(#night)"/><rect width="1120" height="500" rx="22" fill="url(#grid)"/>
  <text x="38" y="38" fill="#d2f36b" font-family="monospace" font-size="11" letter-spacing="2">API INTEGRATION / REQUEST TO DELIVERY</text>
  <text x="1080" y="38" text-anchor="end" fill="#a9b8ae" font-family="monospace" font-size="10">PROFESSIONAL EXPERIENCE</text>
  <path d="M36 60H1084" stroke="#8ca096" stroke-opacity=".25"/>
  <path d="M192 190H474M630 190H747" fill="none" stroke="#d2f36b" stroke-opacity=".82" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M446 274C355 333 218 333 127 274" fill="none" stroke="#a9b8ae" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-sage)"/>
  <g>
    <circle cx="126" cy="190" r="66" fill="#254238" stroke="#d2f36b" stroke-width="2" filter="url(#glow)"/>
    <circle cx="126" cy="190" r="52" fill="none" stroke="#d2f36b" stroke-opacity=".3" stroke-dasharray="3 7"/>
    <circle cx="554" cy="190" r="76" fill="#29483d" stroke="#d2f36b" stroke-width="2"/>
    <circle cx="554" cy="190" r="62" fill="none" stroke="#a9b8ae" stroke-opacity=".28" stroke-dasharray="3 7"/>
    <path d="M808 143l50 28v57l-50 28-50-28v-57z" fill="#e4ebd8" stroke="#d2f36b" stroke-width="2"/>
    <path d="M790 174h36v39h-36zM797 183h22M797 192h22M797 201h14" fill="none" stroke="#486039" stroke-width="2" stroke-linecap="round"/>
    <rect x="950" y="139" width="118" height="105" rx="10" fill="#f4f3ec" stroke="#d2f36b"/>
    <path d="m965 157 44 33 44-33M965 157v69h88v-69" fill="none" stroke="#486039" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g text-anchor="middle" font-family="Arial,sans-serif">
    <text x="126" y="177" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing="1">MY WORK</text><text x="126" y="202" fill="#fcfcf7" font-size="16" font-weight="700">Logic Apps</text><text x="126" y="219" fill="#c5d0c7" font-size="11">dynamic request</text>
    <text x="554" y="171" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing="1">API CALL</text><text x="554" y="197" fill="#fcfcf7" font-size="16" font-weight="700">Function App</text><text x="554" y="216" fill="#c5d0c7" font-size="11">separate code ownership</text>
    <text x="808" y="294" fill="#fcfcf7" font-size="14" font-weight="700">Blob Storage</text><text x="808" y="311" fill="#b9c6ba" font-size="11">generated files</text>
    <text x="1009" y="270" fill="#d2f36b" font-family="monospace" font-size="10">DYNAMIC EMAIL</text>
  </g>
  <g fill="#c5d0c7" font-family="Arial,sans-serif" font-size="11"><text x="126" y="99" text-anchor="middle" fill="#d2f36b" font-family="monospace">01 · REQUEST</text><text x="554" y="99" text-anchor="middle" fill="#d2f36b" font-family="monospace">02 · API CALL</text><text x="808" y="99" text-anchor="middle" fill="#d2f36b" font-family="monospace">03 · GENERATED FILES</text><text x="1009" y="99" text-anchor="middle" fill="#d2f36b" font-family="monospace">04 · EMAIL</text><text x="430" y="346">API response returns to Logic Apps</text></g>
  <path d="M1009 246v142" fill="none" stroke="#d2f36b" stroke-opacity=".75" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
  <path d="M126 258v128" fill="none" stroke="#d2f36b" stroke-opacity=".55" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
  <rect x="38" y="393" width="1044" height="68" rx="12" fill="#19352d" stroke="#536e5e"/>
  <circle cx="67" cy="427" r="11" fill="#d2f36b"/><path d="m62 427 4 4 7-8" fill="none" stroke="#10221e" stroke-width="2" stroke-linecap="round"/>
  <text x="91" y="422" fill="#d2f36b" font-family="monospace" font-size="10" letter-spacing="1">WORKFLOW CONTINUES</text>
  <text x="91" y="443" fill="#fcfcf7" font-family="Arial,sans-serif" font-size="14">Move files to configured destination · prepare report attachments · send dynamic notification</text>
  <text x="1080" y="480" text-anchor="end" fill="#a9b8ae" font-family="Arial,sans-serif" font-size="11">Function App implementation is outside my role.</text>
</svg>
