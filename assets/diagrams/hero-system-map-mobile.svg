<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 760" role="img" aria-labelledby="hero-mobile-title hero-mobile-desc">
  <title id="hero-mobile-title">Data systems map (Mobile)</title>
  <desc id="hero-mobile-desc">Sources connect through Azure Logic Apps orchestration to Blob Storage, downstream file locations, and email.</desc>
  <defs>
    <linearGradient id="m-surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142c25"/>
      <stop offset="100%" stop-color="#0e1d1a"/>
    </linearGradient>
    <linearGradient id="m-hub-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#234237"/>
      <stop offset="100%" stop-color="#183129"/>
    </linearGradient>
    <marker id="m-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 7 4 0 8Z" fill="#d2f36b"/>
    </marker>
    <filter id="m-shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#040b09" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="460" height="760" rx="18" fill="url(#m-surface)" stroke="#2b483e" stroke-width="1.2"/>
  <path d="M20 44H440M20 724H440" stroke="#718c3d" stroke-opacity=".2" stroke-dasharray="2 3"/>

  <!-- Top Metadata -->
  <circle cx="32" cy="28" r="3.5" fill="#d2f36b"/>
  <text x="44" y="32" fill="#d2f36b" font-family="'DM Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5">SYSTEMS I WORK ACROSS</text>
  <text x="44" y="66" fill="#a7b6a5" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1">01 / SOURCES &amp; FORMATS</text>

  <!-- Sources Stack -->
  <g filter="url(#m-shadow)">
    <!-- Customer APIs -->
    <rect x="24" y="82" width="412" height="52" rx="9" fill="#fcfcf7" stroke="#d2d8ce"/>
    <rect x="34" y="90" width="36" height="36" rx="6" fill="#19352d"/>
    <g transform="translate(42, 98)" stroke="#d2f36b" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="m4 5-3 3.5 3 3.5M12 5l3 3.5-3 3.5M10 3l-3 11"/>
    </g>
    <text x="82" y="103" fill="#587332" font-family="'DM Mono', monospace" font-size="8" font-weight="600" letter-spacing="1">CONNECTED SYSTEM</text>
    <text x="82" y="120" fill="#10221e" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Customer APIs</text>
    <text x="420" y="113" text-anchor="end" fill="#6c7c72" font-family="'DM Sans', sans-serif" font-size="10">Dynamic HTTP</text>

    <!-- SQL Server -->
    <rect x="24" y="144" width="412" height="52" rx="9" fill="#fcfcf7" stroke="#d2d8ce"/>
    <rect x="34" y="152" width="36" height="36" rx="6" fill="#19352d"/>
    <g transform="translate(42, 160)" stroke="#d2f36b" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="8" cy="3.5" rx="6" ry="2"/>
      <path d="M2 3.5v7c0 1.2 2.7 2 6 2s6-.8 6-2v-7M2 7.5c0 1.2 2.7 2 6 2s6-.8 6-2"/>
    </g>
    <text x="82" y="165" fill="#587332" font-family="'DM Mono', monospace" font-size="8" font-weight="600" letter-spacing="1">DATABASE</text>
    <text x="82" y="182" fill="#10221e" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">SQL Server</text>
    <text x="420" y="175" text-anchor="end" fill="#6c7c72" font-family="'DM Sans', sans-serif" font-size="10">Procedures &amp; rules</text>

    <!-- Files -->
    <rect x="24" y="206" width="412" height="52" rx="9" fill="#fcfcf7" stroke="#d2d8ce"/>
    <rect x="34" y="214" width="36" height="36" rx="6" fill="#19352d"/>
    <g transform="translate(42, 222)" stroke="#d2f36b" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2H4a1.5 1.5 0 0 0-1.5 1.5v11A1.5 1.5 0 0 0 4 16h8a1.5 1.5 0 0 0 1.5-1.5V6z"/>
      <polyline points="10 2 10 6 14 6"/>
      <line x1="5.5" y1="9.5" x2="10.5" y2="9.5"/>
    </g>
    <text x="82" y="227" fill="#587332" font-family="'DM Mono', monospace" font-size="8" font-weight="600" letter-spacing="1">FILE FORMATS</text>
    <text x="82" y="244" fill="#10221e" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">CSV · TXT · PDF</text>
    <text x="420" y="237" text-anchor="end" fill="#6c7c72" font-family="'DM Sans', sans-serif" font-size="10">Hot folders</text>
  </g>

  <!-- Flow Connector Down into Hub -->
  <path d="M230 268 V 302" stroke="#d2f36b" stroke-width="2" marker-end="url(#m-arrow)"/>

  <!-- Section 02: Orchestration Hub -->
  <text x="230" y="295" text-anchor="middle" fill="#a7b6a5" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1">02 / ORCHESTRATION</text>
  <g filter="url(#m-shadow)">
    <rect x="24" y="312" width="412" height="136" rx="14" fill="url(#m-hub-grad)" stroke="#d2f36b" stroke-width="1.6"/>
    <rect x="210" y="326" width="40" height="40" rx="9" fill="#10221e" stroke="#718c3d"/>
    <g transform="translate(220, 336)" stroke="#d2f36b" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="1" width="4.5" height="4.5" rx="1"/>
      <rect x="14.5" y="1" width="4.5" height="4.5" rx="1"/>
      <rect x="7.7" y="14.5" width="4.5" height="4.5" rx="1"/>
      <path d="M3.2 5.5v2.5a1.5 1.5 0 0 0 1.5 1.5h5.3"/>
      <path d="M16.8 5.5v2.5a1.5 1.5 0 0 1-1.5 1.5H10"/>
      <path d="M10 9.5v5"/>
    </g>
    <text x="230" y="384" text-anchor="middle" fill="#d2f36b" font-family="'DM Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.2">WORKFLOW ORCHESTRATOR</text>
    <text x="230" y="406" text-anchor="middle" fill="#fcfcf7" font-family="'Manrope', sans-serif" font-size="20" font-weight="800">Azure Logic Apps</text>
    <text x="230" y="428" text-anchor="middle" fill="#c7d5cd" font-family="'DM Sans', sans-serif" font-size="11">Triggers · conditions · automated actions</text>
  </g>

  <!-- Flow Connector Down into Destinations -->
  <path d="M230 458 V 492" stroke="#d2f36b" stroke-width="2" marker-end="url(#m-arrow)"/>

  <!-- Section 03: Delivery Stack -->
  <text x="44" y="486" fill="#a7b6a5" font-family="'DM Mono', monospace" font-size="9" letter-spacing="1">03 / DELIVERY &amp; DOWNSTREAM</text>
  <g filter="url(#m-shadow)">
    <!-- Blob Storage -->
    <rect x="24" y="502" width="412" height="52" rx="9" fill="#fcfcf7" stroke="#d2d8ce"/>
    <rect x="34" y="510" width="36" height="36" rx="6" fill="#19352d"/>
    <g transform="translate(42, 518)" stroke="#d2f36b" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="10" cy="4" rx="7" ry="2"/>
      <path d="M3 4v5c0 1.2 3.1 2 7 2s7-.8 7-2V4"/>
      <path d="M3 9v5c0 1.2 3.1 2 7 2s7-.8 7-2V9"/>
    </g>
    <text x="82" y="523" fill="#587332" font-family="'DM Mono', monospace" font-size="8" font-weight="600" letter-spacing="1">CLOUD STORAGE</text>
    <text x="82" y="540" fill="#10221e" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Azure Blob Storage</text>
    <text x="420" y="533" text-anchor="end" fill="#6c7c72" font-family="'DM Sans', sans-serif" font-size="10">Staged reports</text>

    <!-- Downstream destinations -->
    <rect x="24" y="564" width="412" height="52" rx="9" fill="#fcfcf7" stroke="#d2d8ce"/>
    <rect x="34" y="572" width="36" height="36" rx="6" fill="#19352d"/>
    <g transform="translate(42, 580)" stroke="#d2f36b" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 14a1.8 1.8 0 0 1-1.8 1.8H3.8A1.8 1.8 0 0 1 2 14V4a1.8 1.8 0 0 1 1.8-1.8h3.6l1.8 2.7h6.8A1.8 1.8 0 0 1 18 6.7z"/>
      <polyline points="9 9 11.5 11.5 9 14"/>
    </g>
    <text x="82" y="585" fill="#587332" font-family="'DM Mono', monospace" font-size="8" font-weight="600" letter-spacing="1">FILE HANDOFF</text>
    <text x="82" y="602" fill="#10221e" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">File Destinations</text>
    <text x="420" y="595" text-anchor="end" fill="#6c7c72" font-family="'DM Sans', sans-serif" font-size="10">Downstream targets</text>

    <!-- Email -->
    <rect x="24" y="626" width="412" height="52" rx="9" fill="#fcfcf7" stroke="#d2d8ce"/>
    <rect x="34" y="634" width="36" height="36" rx="6" fill="#19352d"/>
    <g transform="translate(42, 642)" stroke="#d2f36b" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="16" height="12" rx="2"/>
      <path d="m3 5 7 5 7-5"/>
    </g>
    <text x="82" y="647" fill="#587332" font-family="'DM Mono', monospace" font-size="8" font-weight="600" letter-spacing="1">NOTIFICATIONS</text>
    <text x="82" y="664" fill="#10221e" font-family="'Manrope', sans-serif" font-size="14" font-weight="700">Email Delivery</text>
    <text x="420" y="657" text-anchor="end" fill="#6c7c72" font-family="'DM Sans', sans-serif" font-size="10">Dynamic notifications</text>
  </g>

  <!-- Bottom Caption -->
  <text x="230" y="744" text-anchor="middle" fill="#8ca094" font-family="'DM Mono', monospace" font-size="9" letter-spacing=".6">CONCEPTUAL MAP · WORKFLOW PATHS VARY</text>
</svg>