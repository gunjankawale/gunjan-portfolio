<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1050" role="img" aria-labelledby="title desc"><title id="title">New CSV to TXT processing workflow</title><desc id="desc">A CSV from an upstream process enters a configured hot folder. Logic Apps triggers, archives the input at a business-designated location, runs stored procedures, creates TXT outputs, delivers them downstream and emails TXT attachments to static recipients.</desc>
<rect width="420" height="1050" rx="24" fill="#10221e"/><text x="25" y="46" fill="#d2f36b" font-family="monospace" font-size="11" letter-spacing="1">NEW WORKFLOW · FRESH REQUIREMENT</text><rect x="20" y="68" width="380" height="858" rx="20" fill="#18382f" stroke="#d2f36b" stroke-width="2"/><text x="43" y="104" fill="#d2f36b" font-family="monospace" font-size="10">LOGIC APPS ORCHESTRATION</text>
<g fill="#fcfcf7"><rect x="43" y="125" width="334" height="76" rx="12"/><rect x="43" y="229" width="334" height="76" rx="12"/><rect x="43" y="333" width="334" height="76" rx="12"/><rect x="43" y="437" width="334" height="76" rx="12"/><rect x="43" y="541" width="334" height="76" rx="12"/><rect x="43" y="645" width="334" height="76" rx="12"/><rect x="43" y="749" width="334" height="144" rx="12"/></g>
<g fill="#10221e" font-family="Arial"><text x="65" y="155" fill="#6a873b" font-family="monospace" font-size="9">UPSTREAM PROCESS</text><text x="65" y="184" font-size="16" font-weight="700">CSV arrives in hot folder</text><text x="65" y="259" fill="#6a873b" font-family="monospace" font-size="9">FILE TRIGGER</text><text x="65" y="288" font-size="16" font-weight="700">Logic Apps starts</text><text x="65" y="363" fill="#6a873b" font-family="monospace" font-size="9">INPUT FILE</text><text x="65" y="392" font-size="16" font-weight="700">Archive at business-set location</text><text x="65" y="467" fill="#6a873b" font-family="monospace" font-size="9">PROCESSING</text><text x="65" y="496" font-size="16" font-weight="700">SQL stored procedures</text><text x="65" y="571" fill="#6a873b" font-family="monospace" font-size="9">OUTPUT</text><text x="65" y="600" font-size="16" font-weight="700">Generate TXT files</text><text x="65" y="675" fill="#6a873b" font-family="monospace" font-size="9">HANDOFF</text><text x="65" y="704" font-size="16" font-weight="700">Required downstream destination</text><text x="65" y="779" fill="#6a873b" font-family="monospace" font-size="9">EMAIL DELIVERY</text><text x="65" y="813" font-size="16" font-weight="700">TXT files as attachments</text><text x="65" y="842" fill="#52645a" font-size="13">Static recipient list in Logic Apps</text><text x="65" y="875" fill="#52645a" font-size="11">One stage; upstream and downstream work</text><text x="65" y="893" fill="#52645a" font-size="11">continue separately.</text></g>
<g stroke="#d2f36b" stroke-width="2.5"><path d="M210 201v22M210 305v22M210 409v22M210 513v22M210 617v22M210 721v22"/></g><g fill="#d2f36b"><path d="m204 215 6 8 6-8z"/><path d="m204 319 6 8 6-8z"/><path d="m204 423 6 8 6-8z"/><path d="m204 527 6 8 6-8z"/><path d="m204 631 6 8 6-8z"/><path d="m204 735 6 8 6-8z"/></g><text x="210" y="984" text-anchor="middle" fill="#c2cfc5" font-family="monospace" font-size="9">LOCATIONS FOLLOW BUSINESS REQUIREMENTS</text><circle r="6" fill="#d2f36b" stroke="#10221e" stroke-width="2" visibility="hidden"><animateMotion begin="indefinite" dur="8s" repeatCount="indefinite" path="M210 201V223V229V327V333V431V437V535V541V639V645V743"/><set attributeName="visibility" to="visible" begin="indefinite"/></circle><g transform="translate(0,-10)" visibility="hidden"><path d="M-7 0H3L8 5V21H-7Z" fill="#fcfcf7" stroke="#718c3d" stroke-width="1.3"/><path d="M3 0V5H8" fill="none" stroke="#718c3d" stroke-width="1.3"/><animateMotion begin="indefinite" dur="8s" repeatCount="indefinite" path="M210 201V223V229V327V333V431V437V535V541V639V645V743"/><set attributeName="visibility" to="visible" begin="indefinite"/></g></svg>
